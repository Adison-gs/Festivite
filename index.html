<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>Festivite</title>

  <link rel="stylesheet" href="./styles/index.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Leckerli+One&family=Open+Sans:ital,wdth,wght@0,75..100,300..800;1,75..100,300..800&display=swap"
    rel="stylesheet">
</head>

<body>

</body>
<div id="layout">
  <aside>
    <div>
      <img src="./assets/Logo.svg" alt="">
      <h1>Festivite</h1>
      <p>Crie um convite digital para o seu evento</p>
    </div>
  </aside>
  <main>
    <h1>Crie seu convite</h1>

    <form method="post" enctype="multipart/form-data">

      <fieldset>
        <legend>
          <img src="./assets/icons/calendar.svg" alt="Ícone de calendário">
          <span>Sobre o evento</span>
        </legend>

        <div class="input-wrapper">

          <!-- Título -->
          <div>
            <label for="event">Título</label>
            <input type="text" name="event" id="event" placeholder="Nome do evento">
          </div>

          <!-- Data e hora -->
          <div class="coluns">

            <div>
              <label for="inicio">Início</label>
              <input type="datetime-local" id="inicio" name="inicio">
            </div>

            <div>
              <label for="fim">Fim</label>
              <input type="datetime-local" id="fim" name="fim">
            </div>



            <!-- Tipo e local -->


            <div>
              <label>Tipo</label>

              <div class="radio-wrapper">
                <div class="radio">

                  <input type="radio" id="presencial" name="tipo" value="presencial" checked>

                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                      d="M5.33325 1.8335C5.11224 1.8335 4.90028 1.92129 4.744 2.07757C4.58772 2.23385 4.49992 2.44582 4.49992 2.66683V14.1668H11.4999V2.66683C11.4999 2.44582 11.4121 2.23385 11.2558 2.07757C11.0996 1.92129 10.8876 1.8335 10.6666 1.8335H5.33325ZM12.4999 5.50016V2.66683C12.4999 2.1806 12.3068 1.71428 11.9629 1.37047C11.6191 1.02665 11.1528 0.833496 10.6666 0.833496H5.33325C4.84702 0.833496 4.38071 1.02665 4.03689 1.37047C3.69307 1.71428 3.49992 2.1806 3.49992 2.66683V7.50016H2.66659C2.18035 7.50016 1.71404 7.69332 1.37022 8.03713C1.02641 8.38095 0.833252 8.84727 0.833252 9.3335V13.3335C0.833252 13.8197 1.02641 14.286 1.37022 14.6299C1.71404 14.9737 2.18035 15.1668 2.66659 15.1668H13.3333C13.8195 15.1668 14.2858 14.9737 14.6296 14.6299C14.9734 14.286 15.1666 13.8197 15.1666 13.3335V7.3335C15.1666 6.84726 14.9734 6.38095 14.6296 6.03713C14.2858 5.69332 13.8195 5.50016 13.3333 5.50016H12.4999ZM12.4999 6.50016V14.1668H13.3333C13.5543 14.1668 13.7662 14.079 13.9225 13.9228C14.0788 13.7665 14.1666 13.5545 14.1666 13.3335V7.3335C14.1666 7.11248 14.0788 6.90052 13.9225 6.74424C13.7662 6.58796 13.5543 6.50016 13.3333 6.50016H12.4999ZM3.49992 8.50016H2.66659C2.44557 8.50016 2.23361 8.58796 2.07733 8.74424C1.92105 8.90052 1.83325 9.11248 1.83325 9.3335V13.3335C1.83325 13.5545 1.92105 13.7665 2.07733 13.9228C2.23361 14.079 2.44557 14.1668 2.66659 14.1668H3.49992V8.50016ZM6.16658 4.00016C6.16658 3.72402 6.39044 3.50016 6.66658 3.50016H9.33325C9.60939 3.50016 9.83325 3.72402 9.83325 4.00016C9.83325 4.2763 9.60939 4.50016 9.33325 4.50016H6.66658C6.39044 4.50016 6.16658 4.2763 6.16658 4.00016ZM6.16658 6.66683C6.16658 6.39069 6.39044 6.16683 6.66658 6.16683H9.33325C9.60939 6.16683 9.83325 6.39069 9.83325 6.66683C9.83325 6.94297 9.60939 7.16683 9.33325 7.16683H6.66658C6.39044 7.16683 6.16658 6.94297 6.16658 6.66683ZM6.16658 9.3335C6.16658 9.05735 6.39044 8.8335 6.66658 8.8335H9.33325C9.60939 8.8335 9.83325 9.05735 9.83325 9.3335C9.83325 9.60964 9.60939 9.8335 9.33325 9.8335H6.66658C6.39044 9.8335 6.16658 9.60964 6.16658 9.3335ZM6.16658 12.0002C6.16658 11.724 6.39044 11.5002 6.66658 11.5002H9.33325C9.60939 11.5002 9.83325 11.724 9.83325 12.0002C9.83325 12.2763 9.60939 12.5002 9.33325 12.5002H6.66658C6.39044 12.5002 6.16658 12.2763 6.16658 12.0002Z"
                      fill="#869198" />
                  </svg>

                  <label for="presencial">Presencial</label>

                </div>

                <div class="radio">
                  <input type="radio" id="online" name="tipo" value="online">

                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                      d="M2.66671 4.5C2.20647 4.5 1.83337 4.8731 1.83337 5.33333V10.6667C1.83337 11.1269 2.20647 11.5 2.66671 11.5H9.33337C9.79361 11.5 10.1667 11.1269 10.1667 10.6667V8.6735C10.1666 8.66864 10.1666 8.66378 10.1667 8.65892V7.00949C10.1666 7.00347 10.1666 6.99746 10.1667 6.99145V5.33333C10.1667 4.8731 9.79361 4.5 9.33337 4.5H2.66671ZM11.1667 6.12939V5.33333C11.1667 4.32081 10.3459 3.5 9.33337 3.5H2.66671C1.65419 3.5 0.833374 4.32081 0.833374 5.33333V10.6667C0.833374 11.6792 1.65419 12.5 2.66671 12.5H9.33337C10.3459 12.5 11.1667 11.6792 11.1667 10.6667V9.60093L13.8717 11.4043C13.9972 11.4878 14.143 11.5357 14.2936 11.5429C14.4441 11.5501 14.5938 11.5163 14.7267 11.4452C14.8596 11.374 14.9707 11.2682 15.0482 11.1389C15.1257 11.0096 15.1666 10.8617 15.1667 10.7109V5.24681C15.1667 5.24677 15.1667 5.24686 15.1667 5.24681C15.1667 5.10024 15.1281 4.9561 15.0547 4.82923C14.9812 4.70231 14.8756 4.59702 14.7485 4.52398C14.6213 4.45094 14.4772 4.41274 14.3305 4.41324C14.1839 4.41374 14.04 4.45291 13.9134 4.52681L11.1667 6.12939ZM11.1667 7.28715V8.39908L14.1667 10.3991V5.53677L11.1667 7.28715Z"
                      fill="#869198" />
                  </svg>

                  <label for="online">Online</label>
                </div>
              </div>
            </div>

            <div>
              <label for="local">Local</label>
              <input type="text" id="local" name="local" placeholder="Link ou endereço">
            </div>

          </div>

          <!-- Descrição -->
          <div>
            <label for="descricao">Descrição</label>

            <textarea name="descricao" id="descricao" placeholder="Escreva sobre os detalhes do evento"></textarea>
          </div>

        </div>
      </fieldset>

      <fieldset>

        <legend>

          <img src="./assets/icons/paint-vertical.svg" alt="Ícone de calendário">

          <span>Personalização</span>

        </legend>

        <div>
          <label for="color">
            Cor principal
          </label>

          <div class="colors">
            <div class="cor">
              <input type="radio" id="blue" name="color" checked>
              <label for="blue"></label>
            </div>

            <div class="cor">
              <input type="radio" id="dark-blue" name="color">
              <label for="dark-blue"></label>
            </div>

            <div class="cor">
              <input type="radio" id="purple" name="color">
              <label for="purple"></label>
            </div>

            <div class="cor">
              <input type="radio" id="fuschia" name="color">
              <label for="fuschia"></label>
            </div>

            <div class="cor">
              <input type="radio" id="pink" name="color">
              <label for="pink"></label>
            </div>

            <div class="cor">
              <input type="radio" id="dark-orange" name="color">
              <label for="dark-orange"></label>
            </div>

            <div class="cor">
              <input type="radio" id="orange" name="color">
              <label for="orange"></label>
            </div>

            <div class="cor">
              <input type="radio" id="yellow" name="color">
              <label for="yellow"></label>
            </div>

            <div class="cor">
              <input type="radio" id="lime" name="color">
              <label for="lime"></label>
            </div>

            <div class="cor">
              <input type="radio" id="green" name="color">
              <label for="green"></label>
            </div>

            <div class="cor">
              <input type="radio" id="light-blue" name="color">
              <label for="light-blue"></label>
            </div>

          </div>

        </div>

        <div class="event-wrapper">

          <label for="input-radio">Tema do evento</label>

          <div class="input-radio">

            <div class="radio-inner">
              <input type="radio" id="aniversario" name="event" checked>
              <img src="./assets/image/1.png" alt="Imagem de decoração de aniversário">
              <label for="aniversario">Aniversário</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="infantil" name="event">
              <img src="./assets/image/2.png" alt="Imagem de decoração de festa infantil">
              <label for="infantil">Infantil</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="formatura" name="event">
              <img src="./assets/image/3.png" alt="Imagem de decoração de formatura">
              <label for="formatura">Formatura</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="casamento" name="event">
              <img src="./assets/image/4.png" alt="Imagem de decoração de casamento">
              <label for="casamento">Casamento</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="cha-de-bebe" name="event">
              <img src="./assets/image/5.png" alt="Imagem de decoração de chá de bebê">
              <label for="cha-de-bebe">Chá de bebê</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="cha-de-panela" name="event">
              <img src="./assets/image/6.png" alt="Imagem de decoração de chá de panela">
              <label for="cha-de-panela">Chá de panela</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="carnaval" name="event">
              <img src="./assets/image/7.png" alt="Imagem de decoração de Carnaval">
              <label for="carnaval">Carnaval</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="pascoa" name="event">
              <img src="./assets/image/8.png" alt="Imagem de decoração de Páscoa">
              <label for="pascoa">Páscoa</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="sao-joao" name="event">
              <img src="./assets/image/9.png" alt="Imagem de decoração de São João">
              <label for="sao-joao">São João</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="halloween" name="event">
              <img src="./assets/image/10.png" alt="Imagem de decoração de Halloween">
              <label for="halloween">Halloween</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="natal" name="event">
              <img src="./assets/image/11.png" alt="Imagem de decoração de Natal">
              <label for="natal">Natal</label>
            </div>

            <div class="radio-inner">
              <input type="radio" id="outro" name="event">
              <img src="./assets/image/12.png" alt="Imagem representando outros tipos de eventos">
              <label for="outro">Outro</label>
            </div>

          </div>
        </div>


        <div class="theme-wrapper">

          <div>
            <label for="theme">Estilo</label>


            <div class="theme-option">

              <div class="theme-switch">
                <div class="switch-control">
                  <input type="checkbox" name="theme" id="theme">
                  <label for="theme"></label>
                </div>
              </div>
              <label for="theme">Escuro</label>
            </div>

          </div>


          <div class="cover-wrapper">
            <label for="cover">Foto de capa</label>

            <div class="cover-inner">
              <div class="send-cover">
                <input type="file" name="cover" id="cover" accept="image/*">
                <img src="./assets/icons/file.svg" alt="">
                <span>Selecionar</span>
              </div>

              <label for="cover">Nenhum arquivo selecionado</label>
            </div>
          </div>
        </div>
      </fieldset>
      <fieldset>
        <legend><img src="./assets/icons/contact.svg" alt="">
          <span>Dados para contato</span>
        </legend>
        <div>
          <label for="name">Nome</label>
          <input type="text" id="name" name="name" placeholder="Nome completo">
          <div class="input-contact">
            <div>
              <label for="email">E-mail</label>
              <input type="email" id="email" name="email" placeholder="exemplo@email.com">
            </div>
            <div>
              <label for="phone">Telefone</label>
              <input type="tel" id="phone" name="phone" placeholder="(99) 99999-9999 ">
            </div>
          </div>
        </div>

        <div class="checkbox-terms">
          <div><input type="checkbox" id="terms" name="terms">
            <label for="terms">Li e concordo com os Termos e <span>Condições</span> e com a <span>Política de
                Privacidade</span></label>
          </div>
          <div><input type="checkbox" id="terms-email" name="terms">
            <label for="terms-email">Aceito receber atualizações e promoções por e-mail</label>
          </div>
          <div><input type="checkbox" id="terms-sms" name="terms">
            <label for="terms-sms">Aceito receber atualizações e promoções por SMS</label>
          </div>
        </div>

        <button type="submit" id="generate-invite"> <img src="./assets/icons/ticket.svg" alt="icone de ticket">Gerar
          convite</button>
      </fieldset>



    </form>
  </main>
</div>

</html>
